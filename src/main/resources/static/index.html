<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能求职辅助系统</title>
    <style>
        :root { --primary: #4f46e5; --text: #1f2937; --muted: #6b7280; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
            background: radial-gradient(circle at 20% 20%, #eef2ff, #f8fafc 60%); color: var(--text);
        }
        .card {
            width: min(640px, 92vw); background: #fff; border-radius: 16px; padding: 40px;
            box-shadow: 0 20px 50px rgba(49, 46, 129, .12); text-align: center;
        }
        h1 { margin: 0 0 10px; font-size: 26px; }
        p { color: var(--muted); line-height: 1.8; font-size: 14px; }
        .btn {
            display: inline-block; margin-top: 18px; padding: 11px 26px; border-radius: 10px;
            background: var(--primary); color: #fff; text-decoration: none; font-size: 15px;
        }
        .btn:hover { background: #4338ca; }
        .tip { margin-top: 22px; font-size: 12px; color: var(--muted); }
        .tip code { background: #f3f4f6; padding: 1px 6px; border-radius: 4px; }
    </style>
</head>
<body>
<div class="card">
    <h1>智能求职辅助系统</h1>
    <p>
        简历管理 · 岗位分析 · 文字模拟面试 · 反馈报告<br>
        基于 Spring Boot 3 + Spring AI（通义千问）构建，AI 不可用时自动降级为本地规则，功能依然可用。
    </p>
    <a class="btn" href="./job/index.html">进入系统</a>
    <div class="tip">
        演示账号：<code>jobuser / 123456</code>（普通用户）、<code>admin / 123456</code>（管理员）<br>
        健康检查：<code>GET /api/job/auth/ping</code>
    </div>
</div>
</body>
</html>
