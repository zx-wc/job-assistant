<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能求职辅助系统</title>
    <link rel="stylesheet" href="./css/job.css">
</head>
<body>
<div class="app-shell">
    <!-- 侧边导航 -->
    <aside class="sidebar">
        <div class="brand">
            <span class="brand-logo">求</span>
            <div>
                <strong>智能求职助手</strong>
                <small>简历 · 分析 · 模拟面试</small>
            </div>
        </div>
        <nav id="nav" class="nav">
            <a href="#/dashboard" data-route="/dashboard"><span>📊</span>求职概览</a>
            <a href="#/resumes" data-route="/resumes"><span>📄</span>简历管理</a>
            <a href="#/positions" data-route="/positions"><span>🎯</span>岗位管理</a>
            <a href="#/analyses" data-route="/analyses"><span>🧭</span>简历分析</a>
            <a href="#/interviews" data-route="/interviews"><span>🎤</span>模拟面试</a>
            <a href="#/admin" data-route="/admin" id="nav-admin" hidden><span>⚙️</span>AI 网关管理</a>
        </nav>
        <div class="sidebar-footer">
            <span class="hint">AI 评价仅作练习参考，不构成真实面试结论</span>
        </div>
    </aside>

    <!-- 主区域 -->
    <div class="main">
        <header class="topbar">
            <div class="topbar-title" id="page-title">求职概览</div>
            <div class="topbar-user">
                <span id="user-badge" class="user-badge" hidden></span>
                <button id="btn-logout" class="btn btn-ghost" hidden>退出登录</button>
            </div>
        </header>
        <main id="view" class="view">
            <div class="loading">加载中…</div>
        </main>
    </div>
</div>

<div id="toast-box" class="toast-box"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
